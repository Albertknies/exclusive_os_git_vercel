<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliar atendimento · Exclusive OS</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#252545;font:16px system-ui,Arial}header{background:#252545;color:#fff;padding:25px;text-align:center;font-weight:750}header span{color:#e3bd68}main{max-width:620px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e0d7;border-radius:16px;padding:30px;box-shadow:0 12px 35px #2221}h1{font-size:25px;margin-top:0}p{line-height:1.55;color:#66677b}.stars{display:flex;gap:8px;margin:20px 0}.stars button{font-size:40px;color:#c9c9d2;background:transparent;border:0;cursor:pointer;padding:3px}.stars button.active{color:#d7a744}textarea{width:100%;padding:13px;min-height:125px;border:1px solid #c9c9d5;border-radius:9px;font:inherit;resize:vertical}label{font-weight:650;display:block;margin:20px 0 8px}.submit{background:#292950;color:#fff;border:0;border-radius:9px;padding:13px 22px;font-weight:750;cursor:pointer;margin-top:18px}.submit:disabled{opacity:.5}.error{color:#a22}.ok{color:#276536}</style></head><body><header>◆ EXCLUSIVE OS <span>| Avaliação de atendimento</span></header><main><div class="card"><h1>Como foi seu atendimento?</h1><p id="context">Carregando avaliação...</p><form id="form" hidden><label>Escolha de 1 a 5 estrelas</label><div class="stars" id="stars" role="group" aria-label="Nota do atendimento"></div><label for="observacao">Observação (opcional)</label><textarea id="observacao" maxlength="1000" placeholder="Conte como foi o atendimento e o que podemos melhorar."></textarea><button class="submit" id="send" type="submit">Enviar avaliação</button></form><p id="message" role="status"></p></div></main><script>const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('form'),stars=document.getElementById('stars'),context=document.getElementById('context'),message=document.getElementById('message');let nota=0;for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('aria-label',i+' estrelas');b.onclick=()=>{nota=i;for(const [index,btn] of [...stars.children].entries()){btn.classList.toggle('active',index<i);btn.setAttribute('aria-pressed',String(index<i))}};stars.append(b)}async function init(){try{const r=await fetch('/api/avaliar-chamado?token='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error||'Link inválido');context.textContent='Protocolo: '+(d.protocolo||'Chamado encerrado');if(d.avaliado){message.textContent='Este atendimento já foi avaliado.';return}form.hidden=false}catch(e){context.textContent='Não foi possível abrir a avaliação.';message.className='error';message.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();if(!nota){message.className='error';message.textContent='Escolha uma nota de 1 a 5 estrelas.';return}const btn=document.getElementById('send');btn.disabled=true;try{const r=await fetch('/api/avaliar-chamado',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,nota,observacao:document.getElementById('observacao').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao enviar');form.hidden=true;message.className='ok';message.textContent='Obrigado! Sua avaliação foi registrada com sucesso.'}catch(e){message.className='error';message.textContent=e.message;btn.disabled=false}};init();</script></body></html>
