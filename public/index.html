:30px 34px;max-width:1660px;margin:auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:23px;flex-wrap:wrap}h1{font-size:27px;letter-spacing:-.8px;margin:0 0 5px}h2{font-size:16px;margin:0}p{margin:0}.sub{color:var(--muted);font-size:13px}.btn{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:10px 15px;border-radius:9px;font-weight:650;white-space:nowrap}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:#fff;color:var(--navy);border-color:#dedde6}.btn.gold{background:var(--gold);border-color:var(--gold)}.btn.small{padding:7px 10px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:19px}.metric,.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:19px 20px}.metric .topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metric .value{font-size:30px;font-weight:780;letter-spacing:-1px;margin:9px 0 3px}.metric .hint{font-size:11px;color:var(--muted)}.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f1f0f8;color:var(--navy);font-size:17px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.panel{padding:20px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}.panelhead small{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.input,select,textarea{border:1px solid #dedee5;background:#fff;color:var(--ink);border-radius:9px;padding:10px 12px;min-width:0;outline:none}.input:focus,select:focus,textarea:focus{border-color:#7776aa;box-shadow:0 0 0 3px #37346a16}.search{min-width:235px;flex:1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;background:#f9f8f6;color:#858493;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:750}td,th{padding:13px 12px;border-bottom:1px solid #f0eeeb}tbody tr:hover{background:#fbfaf8}tbody tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;border-radius:50px;padding:4px 9px;font-size:10px;font-weight:750;background:#f0eff4;color:#555574}.pill.red{background:#fbeaea;color:#b94c4f}.pill.green{background:#e7f5ef;color:#23785e}.pill.amber{background:#fff3dd;color:#a87523}.pill.blue{background:#eaf1fc;color:#426b9e}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px}.progress{height:7px;border-radius:10px;background:#efedf0;overflow:hidden}.progress>div{height:100%;background:var(--gold);border-radius:10px}.staff{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.staffcard{padding:17px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.staffcard:hover{border-color:#aaa2c6}.staffcard .initial{width:36px;height:36px;border-radius:10px;background:#eceaf4;color:var(--navy);display:grid;place-items:center;font-weight:800}.staffcard .line{display:flex;gap:10px;align-items:center;margin-bottom:14px}.staffcard .row{display:flex;justify-content:space-between;margin:8px 0;font-size:12px}.muted{color:var(--muted)}.alerts{display:flex;flex-direction:column;gap:10px}.alert{padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;gap:11px;align-items:flex-start}.alert b{display:block;font-size:12px}.alert small{display:block;color:var(--muted);margin-top:3px}.chartbars{display:flex;align-items:flex-end;gap:14px;height:190px;border-bottom:1px solid #e9e7e3;padding:10px 0 0}.barcol{flex:1;min-width:0;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(100%,52px);border-radius:6px 6px 0 0;background:linear-gradient(180deg,#a48b61,#d2c1a2)}.barcol small{font-size:10px;color:var(--muted)}.barcol b{font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}.modalshade{position:fixed;inset:0;background:#18182d9c;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:25px;box-shadow:0 24px 90px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.close{border:0;background:#f2f1f0;width:31px;height:31px;border-radius:8px;font-size:19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.cardlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.condocard{background:#fff;border:1px solid var(--line);padding:18px;border-radius:12px;cursor:pointer}.condocard:hover{border-color:var(--gold)}.condocard h3{font-size:14px;margin:8px 0 3px}.condocard .statline{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:15px;padding-top:12px;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detailrow{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:10px 0;font-size:13px}.detailrow span:first-child{color:var(--muted)}.timeline{border-left:2px solid #ded9c9;padding-left:15px;margin:12px 0}.timeline div{padding:8px 0;font-size:12px}.timeline small{display:block;color:var(--muted)}.menuToggle{display:none}.notice{background:#f4f1e8;border:1px solid #e9dfca;color:#7b6337;border-radius:10px;padding:11px 14px;font-size:12px;margin-bottom:18px}.click{cursor:pointer;color:var(--navy);font-weight:700}.click:hover{text-decoration:underline}.kpisub{font-size:12px;color:var(--muted)}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button{border:1px solid var(- 'use strict';const NAMES=['Cristiano','Grégory','William','Lucas','André','Raviel','Arian/Jéssica'];const WEIGHTS={A:4,B:7,C:11,D:16};const ALLOC=[[5,7,4,2],[4,8,4,2],[6,6,4,2],[5,7,4,2],[4,8,4,2],[6,6,4,2]];const BASE=['Jardim das Palmeiras','Residencial Aurora','Solar das Acácias','Parque das Flores','Edifício Horizonte','Residencial Primavera','Monte Verde','Villa Toscana','Bela Vista','Jardins do Sul','Torre Imperial','Residencial Harmonia','Solar do Lago','Portal das Flores','Bosque das Oliveiras','Monte Carmelo','Villa Serena','Residencial Firenze'];const TYPES=['Residencial','Edifício','Condomínio','Residencial','Torre'];const EQUIP=['Elevadores','Bombas hidráulicas','Portões','Sistema de incêndio','Gerador','Piscina'];const today=()=>new Date().toISOString().slice(0,10);const addDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};function seed(){let condos=[],id=1;NAMES.slice(0,ALLOC.length).forEach((owner,j)=>{let seq=[];ALLOC[j].forEach((count,i)=>{for(let k=0;k<count;k++)seq.push('ABCD'[i])});seq.forEach((classe,k)=>{let n=id++;condos.push({id:n,nome:n<=18?BASE[n-1]:`${TYPES[n%5]} ${['das Araucárias','Santa Clara','do Parque','Flor de Lis','Monte Azul','das Hortênsias','Novo Horizonte','Bela Morada','do Vale'][n%9]} ${String(n).padStart(2,'0')}`,sindico:owner,classe,unidades:classe==='A'?20+n%20:classe==='B'?55+n%40:classe==='C'?110+n%90:220+n%180,regiao:['Centro','Camobi','Nossa Senhora de Lourdes','Medianeira','Patronato','Dores'][n%6],equipamentos:EQUIP.slice(0,classe==='A'?2:classe==='B'?3:classe==='C'?4:6),status:n%17===0?'Atenção':'Regular'})})});let tasks=[['Revisar manutenção preventiva dos elevadores',1,0,'Alta',-1,'Em andamento','Manutenção'],['Retornar solicitação do conselho',2,1,'Crítica',0,'Aberta','Atendimento'],['Cobrar orçamento de impermeabilização',3,2,'Média',1,'Aguardando terceiro','Fornecedor'],['Validar vistoria das bombas',4,3,'Alta',-2,'Em andamento','Vistoria'],['Organizar pauta da assembleia',5,4,'Média',3,'Aberta','Assembleia'],['Confirmar reparo no portão',6,5,'Alta',0,'Aguardando terceiro','Manutenção'],['Atualizar cadastro de fornecedores',7,0,'Baixa',5,'Aberta','Administrativo'],['Inspecionar extintores e sinalização',8,1,'Alta',2,'Aberta','Vistoria'],['Cobrar relatório de manutenção',9,2,'Média',-3,'Aguardando terceiro','Fornecedor'],['Enviar retorno sobre vazamento',10,3,'Crítica',-1,'Aberta','Atendimento'],['Revisar documentação de contrato',11,4,'Média',4,'Em andamento','Documentação'],['Conferir execução da pintura',12,5,'Média',-2,'Em andamento','Manutenção']].map((a,i)=>({id:i+1,titulo:a[0],condoId:a[1],responsavel:NAMES[a[2]],prioridade:a[3],prazo:addDays(a[4]),status:a[5],categoria:a[6],descricao:'Acompanhar a demanda e registrar a próxima providência.',historico:[{data:today(),texto:'Atividade registrada no sistema demonstrativo.'}]}));return {condos,tasks,inspections:[{id:1,condoId:4,responsavel:'Vistoriador',data:addDays(1),status:'Agendada',observacoes:''},{id:2,condoId:8,responsavel:'Vistoriador',data:addDays(-1),status:'Pendente',observacoes:''},{id:3,condoId:11,responsavel:'Vistoriador',data:addDays(3),status:'Agendada',observacoes:''}],activity:[]}}
const STORE='exclusive_os_prof_v2';let db;try{db=JSON.parse(localStorage.getItem(STORE))||seed()}catch(e){db=seed()}let state={page:'dashboard',query:'',owner:'Todos',status:'Todos',classe:'Todas',modal:null,detail:null,mobile:false};const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}};const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const condo=id=>db.condos.find(c=>c.id===Number(id));const ownerOptions=(all=true)=>`${all?'<option>Todos</option>':''}${NAMES.map(n=>`<option ${state.owner===n?'selected':''}>${n}</option>`).join('')}`;const pill=(x)=>{let color=({'Crítica':'red','Alta':'red','Atrasada':'red','Atrasado':'red','Atenção':'amber','Média':'amber','Aguardando terceiro':'amber','Em andamento':'blue','Concluída':'green','Concluído':'green','Regular':'green','Agendada':'blue','Validada':'green','D':'red','C':'amber','B':'blue','A':'green'})[x]||'';return `<span class="pill ${color}">${esc(x)}</span>`};const isLate=t=>t.status!=='Concluída'&&t.prazo<today();const fmt=d=>d?d.split('-').reverse().join('/'):'—';const openTasks=()=>db.tasks.filter(t=>t.status!=='Concluída');const late=()=>openTasks().filter(isLate);const crit=()=>openTasks().filter(t=>t.prioridade==='Crítica');const load=n=>db.condos.filter(c=>c.sindico===n).reduce((s,c)=>s+WEIGHTS[c.classe],0);const nav=[['dashboard','◫','Visão geral'],['condos','▦','Condomínios'],['team','♙','Equipe e carteiras'],['tasks','☑','Tarefas e processos'],['calls','◉','Central de chamados'],['maintenance','⚒','Manutenções'],['inspections','▤','Vistorias'],['reports','▥','Indicadores']];const headings={dashboard:['Visão geral','Acompanhe toda a operação em um único lugar.'],condos:['Condomínios','Cadastro, complexidade e gestão das 108 unidades da carteira.'],team:['Equipe e carteiras','Distribuição operacional, capacidade e desempenho.'],tasks:['Tarefas e processos','Prazos, responsáveis, evidências e acompanhamento.'],calls:['Central de chamados','Triagem e tratamento das solicitações dos condomínios.'],maintenance:['Manutenções','Controle de serviços e ações preventivas.'],inspections:['Vistorias','Agenda, execução e acompanhamento de inspeções.'],reports:['Indicadores','Qualidade operacional e evolução da carteira.']};function metric(title,value,hint,icon){return `<div class="metric"><div class="topline"><span>${title}</span><span class="ico">${icon}</span></div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}function titlePanel(title,right=''){return `<div class="panelhead"><h2>${title}</h2>${right}</div>`}function render(){let page=state.page;$('#root').innerHTML=`<div class="mobilebackdrop ${state.mobile?'open':''}" onclick="UI.mobile(false)"></div><div class="app"><aside class="sidebar ${state.mobile?'open':''}"><div class="brand"><div class="brandmark">▥</div><div><strong>EXCLUSIVE SÍNDICOS</strong><small>GESTÃO OPERACIONAL</small></div></div><nav class="nav"><div class="navlabel">PAINEL</div>${nav.map((n,i)=>`${i===4?'<div class="navlabel">OPERAÇÃO</div>':''}<button class="navbtn ${page===n[0]?'active':''}" onclick="UI.page('${n[0]}')"><span class="sym">${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="sidefoot">● Ambiente de demonstração<br>Dados fictícios · Salvos neste navegador</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:13px"><button class="menuToggle" onclick="UI.mobile(true)">☰</button><div><div class="crumb">Exclusive / Operações</div><b>${headings[page][0]}</b></div></div><div class="topright"><span class="sub">Ambiente demonstrativo</span><span class="avatar">EX</span></div></header><div class="content"><div class="heading"><div><h1>${headings[page][0]}</h1><p class="sub">${headings[page][1]}</p></div>${page==='tasks'||page==='calls'||page==='maintenance'?`<button class="btn" onclick="UI.newTask('${page}')">＋ ${page==='calls'?'Novo chamado':page==='maintenance'?'Nova manutenção':'Nova tarefa'}</button>`:page==='condos'?'<button class="btn" onclick="UI.newCondo()">＋ Novo condomínio</button>':page==='inspections'?'<button class="btn" onclick="UI.newInspection()">＋ Agendar vistoria</button>':['portal','approvals','inbox','ratings'].includes(page)?'':'<button class="btn secondary small" onclick="UI.exportCSV()">↓ Exportar relatório CSV</button>'}</div><div class="notice">Versão de testes: dados fictícios e armazenamento local. Sem login, servidor, notificações reais ou integração com WhatsApp.</div>${views[page]()}<footer class="sub" style="padding:15px 0 25px;text-align:center">Exclusive Síndicos · Sistema demonstrativo · ${new Date().getFullYear()}</footer></div></main></div>${state.modal?renderModal():''}`}
const views={dashboard(){let tasks=openTasks();return `<div class="metrics">${metric('Condomínios ativos',db.condos.length,'Carteiras a definir','▦')}${metric('Processos abertos',tasks.length,`${late().length} com prazo vencido`,'☑')}${metric('Demandas críticas',crit().length,'Prioridade máxima','!')}${metric('Vistorias pendentes',db.inspections.filter(x=>x.status!=='Concluída').length,'Agenda de inspeções','▤')}</div><div class="two"><div><div class="panel">${titlePanel('Carga operacional por síndico','<small>Índice de complexidade · não mede produtividade</small>')}<div class="chartbars">${NAMES.filter(n=>db.condos.some(c=>c.sindico===n)).map(n=>`<div class="barcol"><b>${load(n)}</b><div class="bar" style="height:${Math.round(load(n)/175*135)}px"></div><small>${n}</small></div>`).join('')}</div><p class="sub" style="margin-top:12px">Cálculo: classe A = 4 pts · B = 7 pts · C = 11 pts · D = 16 pts. Soma por carteira. Pesos provisórios para planejamento; não representam horas trabalhadas ou desempenho.</p></div><div class="panel">${titlePanel('Carteiras em acompanhamento','<small>Selecione para visualizar</small>')}<div class="staff">${NAMES.filter(n=>db.condos.some(c=>c.sindico===n)).map(n=>staffCard(n)).join('')}</div></div></div><div><div class="panel">${titlePanel('Atenção da gerência',`<span class="pill red">${late().length} atrasos</span>`)}<div class="alerts">${[...late(),...crit().filter(t=>!isLate(t))].slice(0,6).map(t=>`<div class="alert"><span style="color:var(--red)">●</span><div style="flex:1"><b>${esc(t.titulo)}</b><small>${esc(condo(t.condoId)?.nome)} · ${esc(t.responsavel)} · ${fmt(t.prazo)}</small></div><button class="btn secondary small" onclick="UI.detailTask(${t.id})">Abrir</button></div>`).join('')||'<div class="empty">Nenhum alerta crítico no momento.</div>'}</div></div><div class="panel">${titlePanel('Distribuição por complexidade')}<div class="split">${'ABCD'.split('').map(c=>`<div style="padding:12px;background:#f8f7f5;border-radius:9px"><span class="muted">Classe ${c}</span><div style="font-size:24px;font-weight:800">${db.condos.filter(x=>x.classe===c).length}</div><small>${WEIGHTS[c]} pontos por condomínio</small></div>`).join('')}</div></div></div></div>`},condos(){let a=db.condos.filter(c=>(currentUser()?.perfil!=='Síndico'||c.sindico===currentUser().nome)&&(state.owner==='Todos'||c.sindico===state.owner)&&(state.classe==='Todas'||c.classe===state.classe)&&(`${c.nome} ${c.regiao} ${c.sindico}`.toLowerCase().includes(state.query.toLowerCase())));return `<div class="panel"><div class="toolbar"><input class="input search" placeholder="Buscar condomínio, região ou síndico" value="${esc(state.query)}" oninput="UI.filter('query',this.value)"><select onchange="UI.filter('owner',this.value)">${ownerOptions()}</select><select onchange="UI.filter('classe',this.value)">${['Todas','A','B','C','D'].map(c=>`<option ${state.classe===c?'selected':''}>${c}</option>`).join('')}</select><span class="sub">${a.length} resultados</span></div><div class="tablewrap"><table><thead><tr><th>Condomínio</th><th>Responsável</th><th>Região</th><th>Unidades</th><th>Classe</th><th>Carga</th><th>Situação</th><th></th></tr></thead><tbody>${a.map(c=>`<tr><td><a class="click" onclick="UI.detailCondo(${c.id})">${esc(c.nome)}</a></td><td>${c.sindico}</td><td>${c.regiao}</td><td>${c.unidades}</td><td>${pill(c.classe)}</td><td>${WEIGHTS[c.classe]} pts</td><td>${pill(c.status)}</td><td><button class="btn secondary small" onclick="UI.detailCondo(${c.id})">Detalhes</button></td></tr>`).join('')}</tbody></table>${!a.length?'<div class="empty">Nenhum condomínio encontrado.</div>':''}</div></div>`},team(){return `<div class="metrics">${metric('Síndicos',NAMES.filter(n=>db.condos.some(c=>c.sindico===n)).length,'Carteiras ativas','♙')}${metric('Pontos totais',NAMES.reduce((s,n)=>s+load(n),0),'Soma das carteiras','▥')}${metric('Média de carga',Math.round(NAMES.reduce((s,n)=>s+load(n),0)/Math.max(1,NAMES.filter(n=>db.condos.some(c=>c.sindico===n)).length)),'Pontos por síndico','◫')}${metric('Diferença entre carteiras',Math.max(...NAMES.map(load))-Math.min(...NAMES.map(load)),'Pontos de amplitude','↗')}</div><div class="panel">${titlePanel('Desempenho das carteiras')}<div class="staff">${NAMES.filter(n=>db.condos.some(c=>c.sindico===n)).map(n=>staffCard(n)).join('')}</div></div><div class="panel">${titlePanel('Matriz de complexidade')}<div class="tablewrap"><table><thead><tr><th>Síndico</th><th>Classe A</th><th>Classe B</th><th>Classe C</th><th>Classe D</th><th>Condomínios</th><th>Carga</th><th>Pendências</th></tr></thead><tbody>${NAMES.map(n=>{let c=db.condos.filter(x=>x.sindico===n);return `<tr><td><b>${n}</b></td>${'ABCD'.split('').map(k=>`<td>${c.filter(x=>x.classe===k).length}</td>`).join('')}<td>${c.length}</td><td>${load(n)}</td><td>${openTasks().filter(t=>t.responsavel===n).length}</td></tr>`}).join('')}</tbody></table></div></div>`},tasks(){return taskView('all')},calls(){return taskView('Atendimento')},maintenance(){return taskView('Manutenção')},inspections(){return `<div class="metrics">${metric('Vistorias cadastradas',db.inspections.length,'Agendamentos demonstrativos','▤')}${metric('Agendadas',db.inspections.filter(x=>x.status==='Agendada').length,'Visitas futuras','▦')}${metric('Pendentes',db.inspections.filter(x=>x.status==='Pendente').length,'Acompanhar execução','!')}${metric('Concluídas',db.inspections.filter(x=>x.status==='Concluída').length,'Com registro de inspeção','✓')}</div><div class="panel">${titlePanel('Agenda de vistorias')}<div class="tablewrap"><table><thead><tr><th>Condomínio</th><th>Data</th><th>Responsável</th><th>Situação</th><th>Observações</th><th></th></tr></thead><tbody>${db.inspections.map(i=>`<tr><td>${esc(condo(i.condoId)?.nome)}</td><td>${fmt(i.data)}</td><td>${esc(i.responsavel)}</td><td>${pill(i.status)}</td><td>${esc(i.observacoes||'—')}</td><td><button class="btn secondary small" onclick="UI.detailInspection(${i.id})">Atualizar</button></td></tr>`).join('')}</tbody></table></div></div>`},reports(){let all=db.tasks.length,done=db.tasks.filter(t=>t.status==='Concluída').length,within=db.tasks.filter(t=>!isLate(t)).length;return `<div class="metrics">${metric('Processos concluídos',done,`De ${all} processos registrados`,'✓')}${metric('Taxa de conclusão',all?Math.round(done/all*100)+'%':'0%','Sobre tarefas cadastradas','◫')}${metric('Dentro do prazo',all?Math.round(within/all*100)+'%':'0%','Indicador demonstrativo','◷')}${metric('Carga total',db.condos.reduce((s,c)=>s+WEIGHTS[c.classe],0),'Pontos de complexidade','▥')}</div><div class="two"><div class="panel">${titlePanel('Processos por responsável')}<div class="tablewrap"><table><thead><tr><th>Síndico</th><th>Em aberto</th><th>Atrasados</th><th>Concluídos</th></tr></thead><tbody>${NAMES.map(n=>`<tr><td>${n}</td><td>${openTasks().filter(t=>t.responsavel===n).length}</td><td>${late().filter(t=>t.responsavel===n).length}</td><td>${db.tasks.filter(t=>t.responsavel===n&&t.status==='Concluída').length}</td></tr>`).join('')}</tbody></table></div></div><div class="panel">${titlePanel('Critérios de controle')}<p class="sub">Cada condomínio possui uma classe de complexidade e uma carga relativa. Os indicadores são calculados sobre os registros locais. Para uso real, será necessário configurar SLAs, validação de evidências, regras de escalonamento, auditoria e perfis de acesso.</p><div style="margin-top:20px"><button class="btn" onclick="UI.exportCSV()">↓ Exportar CSV</button></div></div></div>`}};
function staffCard(n){let count=db.condos.filter(c=>c.sindico===n).length;let overdue=late().filter(t=>t.responsavel===n).length;return `<div class="staffcard" onclick="UI.staff('${n}')"><div class="line"><div class="initial">${n.slice(0,2).toUpperCase()}</div><div><b>${n}</b><div class="sub">Síndico profissional</div></div></div><div class="row"><span class="muted">Condomínios</span><b>${count}</b></div><div class="row"><span class="muted">Carga operacional</span><b>${load(n)} pts</b></div><div class="progress"><div style="width:${Math.min(100,load(n)/160*100)}%"></div></div><div class="row"><span class="muted">Tarefas vencidas</span>${pill(overdue?`${overdue} atrasadas`:'Em dia')}</div></div>`}function taskView(type){let list=db.tasks.filter(t=>(currentUser()?.perfil!=='Síndico'||t.responsavel===currentUser().nome)&&(type==='all'||t.categoria===type)&&(state.owner==='Todos'||t.responsavel===state.owner)&&(state.status==='Todos'||(state.status==='Atrasadas'?isLate(t):t.status===state.status))&&(`${t.titulo} ${condo(t.condoId)?.nome} ${t.responsavel}`.toLowerCase().includes(state.query.toLowerCase())));return `<div class="metrics">${metric('Total de registros',db.tasks.filter(t=>type==='all'||t.categoria===type).length,'Histórico completo','☑')}${metric('Em aberto',db.tasks.filter(t=>(type==='all'||t.categoria===type)&&t.status!=='Concluída').length,'Exigem acompanhamento','◷')}${metric('Atrasadas',db.tasks.filter(t=>(type==='all'||t.categoria===type)&&isLate(t)).length,'Prazos vencidos','!')}${metric('Concluídas',db.tasks.filter(t=>(type==='all'||t.categoria===type)&&t.status==='Concluída').length,'Registradas como finalizadas','✓')}</div><div class="panel"><div class="toolbar"><input class="input search" placeholder="Pesquisar demanda ou condomínio" value="${esc(state.query)}" oninput="UI.filter('query',this.value)"><select onchange="UI.filter('owner',this.value)">${ownerOptions()}</select><select onchange="UI.filter('status',this.value)">${['Todos','Aberta','Em a ateTask(event,${t.id})"><div class="formgrid"><label class="field">Atualizar status<select name="status">${['Aberta','Em andamento','Aguardando terceiro','Aguardando validação','Concluída'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Responsável<select name="responsavel">${NAMES.map(n=>`<option ${n===t.responsavel?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Novo prazo<input class="input" type="date" name="prazo" value="${t.prazo}" required></label><label class="field full">Registro da providência / evidência textual<textarea name="nota" rows="3" required placeholder="Descreva o atendimento, protocolo, comprovante ou próxima ação"></textarea></label></div><p class="sub" style="margin-top:10px">A versão de testes aceita registro textual. Anexos e validação independente exigem backend e controle de acesso.</p><div class="modalactions"><button type="button" class="btn secondary" onclick="UI.close()">Cancelar</button><button class="btn">Salvar atualização</button></div></form><h2 style="margin-top:25px">Histórico</h2><div class="timeline">${[...t.historico].reverse().map(h=>`<div><small>${fmt(h.data)}</small>${esc(h.texto)}</div>`).join('')}</div>`)}if(m==='inspection'){let i=db.inspections.find(x=>x.id===state.detail);return modal('Registro de vistoria',`<p class="sub" style="margin-bottom:15px">${esc(condo(i.condoId)?.nome)} · ${fmt(i.data)}</p><form onsubmit="UI.updateInspection(event,${i.id})"><div class="formgrid"><label class="field">Situação<select name="status">${['Agendada','Pendente','Em andamento','Concluída'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field full">Relatório / apontamentos<textarea name="observacoes" rows="5" required>${esc(i.observacoes)}</textarea></label></div><p class="sub" style="margin-top:12px">Para produção, a vistoria terá checklist, fotos, anexos e assinatura.</p><div class="moda const UI={page(p){state.page=p;state.query='';state.owner='Todos';state.status='Todos';state.classe='Todas';state.mobile=false;render();window.scrollTo(0,0)},mobile(v){state.mobile=v;render()},filter(k,v){state[k]=v;let focus=document.activeElement?.selectionStart;render();if(k==='query'){let el=$('.search');if(el){el.focus();try{el.setSelectionRange(focus,focus)}catch(e){}}}},close(){state.modal=null;render()},newTask(p){state.detail=p==='calls'?'Atendimento':p==='maintenance'?'Manutenção':'Administrativo';state.modal='newTask';render()},newCondo(){state.modal='newCondo';render()},newInspection(){state.modal='newInspection';render()},detailCondo(id){state.detail=id;state.modal='condo';render()},editCondo(id){state.detail=id;state.modal='editCondo';render()},detailTask(id){state.detail=id;state.modal='task';render()},detailInspection(id){state.detail=id;state.modal='inspection';render()},staff(n){state.owner=n;state.page='tasks';state.status='Todos';render()},submitTask(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let id=Math.max(0,...db.tasks.map(t=>t.id))+1;db.tasks.push({...f,responsavel:assignedSyndic(Number(f.condoId)),id,condoId:Number(f.condoId),status:'Aberta',historico:[{data:today(),texto:'Processo criado na demonstração.'}]});save();UI.close()},submitCondo(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.condos.push({...f,id:Math.max(0,...db.condos.map(c=>c.id))+1,unidades:Number(f.unidades),equipamentos:[],status:'Regular'});save();UI.close()},submitEditCondo(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));Object.assign(condo(id),{...f,unidades:Number(f.unidades)});save();UI.close()},updateTask(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let t=db.tasks.find(x=>x.id===id);Object.assign(t,{status:f.status,responsavel:f.responsavel,prazo:f.prazo});t.historico.push({data:today(),texto:`${f.status}: ${f.nota}`});save();UI.close()},submitInspection(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.inspections.push({...f,id:Math.max(0,...db.inspections.map(i=>i.id))+1,condoId:Number(f.condoId),status:'Agendada'});save();UI.close()},updateInspection(e,id){e.preventDefault();Object.assign(db.inspections.find(x=>x.id===id),Object.fromEntries(new FormData(e.target)));save();UI.close()},exportCSV(){let rows=[['Condomínio','Síndico','Classe','Pontos','Unidades','Região','Situação'],...db.condos.map(c=>[c.nome,c.sindico,c.classe,WEIGHTS[c.classe],c.unidades,c.regiao,c.status])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='exclusive_carteiras.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}};

const portalSeed=()=>({clients:[{id:1,nome:'Mariana Souza (fictício)',cpf:'00000000000',email:'mariana@exemplo.invalid',telefone:'(55) 99999-0000',vinculos:[{condoId:2,tipo:'Proprietário',unidade:'502',status:'Aprovado'}],created:new Date().toISOString()}],tickets:[{id:1,protocol:'EX-'+new Date().getFullYear()+'-00001',clientId:1,condoId:2,titulo:'Vazamento na garagem (exemplo)',descricao:'Há um vazamento próximo à entrada da garagem.',categoria:'Manutenção',status:'Em atendimento',owner:'Não atribuído',created:new Date().toISOString(),messages:[{at:new Date().toISOString(),by:'Cliente',text:'Há um vazamento próximo à entrada da garagem.',visibility:'public'}],resolvedAt:null,closeAt:null,closedBy:null,rating:null}],nextTicket:2,nextClient:2});
let portalDB;try{portalDB=JSON.parse(localStorage.getItem(PORTAL_STORE))||portalSeed()}catch(e){portalDB=portalSeed()}
const portalSave=()=>{try{localStorage.setItem(PORTAL_STORE,JSON.stringify(portalDB))}catch(e){}};
const portalClient=id=>portalDB.clients.find(c=>c.id===Number(id));
const portalTicket=id=>portalDB.tickets.find(t=>t.id===Number(id));
const portalCondoOptions=()=>db.condos.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
const portalDate=iso=>iso?new Date(iso).toLocaleString('pt-BR'):'—';
const portalBadge=status=>pill(status);
const portalTimeLeft=t=>t.closeAt?Math.max(0,Math.ceil((new Date(t.closeAt)-new Date())/3600000)):null;
const portalEscCpf=cpf=>String(cpf||'').replace(/\D/g,'').replace(/^(\d{3})\d{6}(\d{2})$/,'$1.***.***-$2');
const portalCheckAuto=()=>{let changed=false;for(let t of portalDB.tickets){if(t.status==='Aguardando cliente'&&t.closeAt&&Date.now()>=new Date(t.closeAt).getTime()){t.status='Encerrado';t.closedBy='Sistema (72 horas)';t.closedAt=t.closeAt;t.closeAt=null;t.messages.push({at:new Date().toISOString(),by:'Sistema',text:'Encerrado automaticamente após 72 horas sem manifestação do cliente.',visibility:'public'});changed=true}}if(changed)portalSave()};
const portalDetail=(t,mode)=>{let c=portalClient(t.clientId);let v=c?.vinculos.find(v=>v.condoId===t.condoId);return `<div class="panel"><div class="panelhead"><h2>${esc(t.protocol)} · ${esc(t.titulo)}</h2>${portalBadge(t.status)}</div><div class="split"><div class="detailrow"><span>Solicitante</span><b>${esc(c?.nome||'—')}</b></div><div class="detailrow"><span>Condomínio</span><b>${esc(condo(t.condoId)?.nome||'—')}</b></div><div class="detailrow"><span>Vínculo</span><b>${esc(v?.tipo||'—')} · ${esc(v?.status||'—')}</b></div><div class="detailrow"><span>Responsável</span><b>${esc(t.owner||'Não atribuído')}</b></div><div class="detailrow"><span>Abertura</span><b>${portalDate(t.created)}</b></div><div class="detailrow"><span>Prazo 72h</span><b>${t.closeAt?portalDate(t.closeAt):'Não iniciado'}</b></div></div><p class="sub" style="margin:16px 0">${esc(t.descricao)}</p><h3 style="margin:14px 0">Histórico de mensagens</h3><div class="timeline">${t.messages.filter(m=>mode==='admin'||m.visibility==='public').map(m=>`<div><small>${portalDate(m.at)} · ${esc(m.by)}${m.visibility==='internal'?' · Nota interna':''}</small>${esc(m.text)}</div>`).join('')}</div>${mode==='admin'?`<form onsubmit="UI.portalAdminReply(event,${t.id})"><div class="formgrid"><label class="field">Responsável<select name="owner">${NAMES.map(n=>`<option ${t.owner===n?'selected':''}>${n}</option>`).join('')}<option ${t.owner==='Administrativo'?'selected':''}>Administrativo</option></select></label><label class="field">Tipo de atualização<select name="action"><option value="reply">Responder e manter aberto</option><option value="resolve">Resposta conclusiva: iniciar 72h</option><option value="internal">Nota interna</option></select></label><label class="field full">Mensagem<textarea required name="text" rows="3" placeholder="Descreva a providência tomada"></textarea></label></div><div class="modalactions"><button class="btn">Registrar atualização</button></div></form>`:t.status==='Encerrado'?`${t.rating?`<p class="sub">Avaliação enviada: ${t.rating.stars}/5 estrelas · ${esc(t.rating.comment||'Sem comentário')}</p>`:`<form onsubmit="UI.portalRate(event,${t.id})"><div class="formgrid"><label class="field">Avaliação do atendimento<select name="stars" required><option value="">Escolha a nota</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} estrela${n>1?'s':''}</option>`).join('')}</select></label><label class="field full">Observação (opcional)<textarea name="comment" rows="3"></textarea></label></div><div class="modalactions"><button class="btn">Enviar avaliação</button></div></form>`}`:`<form onsubmit="UI.portalClientReply(event,${t.id})"><label class="field full">Enviar mensagem<textarea name="text" rows="3" required placeholder="Escreva sua resposta"></textarea></label><div class="modalactions"><button class="btn secondary" type="button" onclick="UI.portalClientClose(${t.id})">Encerrar chamado</button><button class="btn">Enviar mensagem</button></div></form>`}</div>`};
const portalViews={
 portal(){let c=portalClient(state.portalClientId||1);let v=c?.vinculos||[];return `<div class="metrics">${metric('Meus chamados',portalDB.tickets.filter(t=>t.clientId===c.id).length,'Histórico do solicitante','◉')}${metric('Em andamento',portalDB.tickets.filter(t=>t.clientId===c.id&&t.status!=='Encerrado').length,'Atendimentos abertos','◷')}${metric('Condomínios vinculados',v.length,'Vínculos cadastrados','▦')}${metric('Cadastro',v.some(x=>x.status==='Aprovado')?'Aprovado':'Em análise','Validação administrativa','✓')}</div><div class="panel"><div class="panelhead"><h2>Área do cliente · ${esc(c.nome)}</h2><button class="btn" onclick="UI.portalNewTicket()">＋ Abrir chamado</button></div><p class="sub">Condomínio(s): ${v.map(x=>esc(condo(x.condoId)?.nome)+' ('+esc(x.tipo)+' · '+esc(x.status)+')').join('; ')}</p><p class="sub" style="margin:12px 0">Mesmo com cadastro em análise, a solicitação pode ser registrada. O administrativo fará a validação depois.</p><div class="toolbar"><button class="btn secondary" onclick="UI.portalRegister()">＋ Cadastrar novo cliente</button><select onchange="UI.portalSwitchClient(this.value)">${portalDB.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div></div><div class="panel" style="margin-top:14px">${titlePanel('Meus chamados')}${portalDB.tickets.filter(t=>t.clientId===c.id).map(t=>`<div class="detailrow"><a class="click" onclick="UI.portalOpenTicket(${t.id})">${esc(t.protocol)} · ${esc(t.titulo)}</a>${portalBadge(t.status)}</div>`).join('')||'<p class="sub">Nenhum chamado ainda.</p>'}</div><p class="sub" style="margin-top:15px">Ambiente fictício de teste. Não utilize dados pessoais reais: o armazenamento é local e não tem autenticação ou proteção de produção.</p>`},
 approvals(){let pending=portalDB.clients.filter(c=>c.vinculos.some(v=>v.status==='Em análise'));return `<div class="metrics">${metric('Cadastros pendentes',pending.length,'Exigem validação','!')}${metric('Clientes cadastrados',portalDB.clients.length,'Base demonstrativa','♙')}${metric('Chamados recebidos',portalDB.tickets.length,'Inclusive não validados','◉')}${metric('Chamados em aberto',portalDB.tickets.filter(t=>t.status!=='Encerrado').length,'Fila de atendimento','◷')}</div><div class="panel">${titlePanel('Validação de clientes')}<p class="sub" style="margin:0 0 15px">O chamado é recebido antes da aprovação do cadastro. Aprovar ou rejeitar o vínculo não apaga solicitações já registradas.</p><div class="toolbar"><input class="input search" placeholder="Pesquisar nome, e-mail, CPF ou condomínio" value="${esc(state.portalSearch||'')}" oninput="UI.portalSearch(this.value)"></div><div style="overflow:auto"><table><thead><tr><th>Cliente</th><th>Condomínio</th><th>Vínculo</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${portalDB.clients.flatMap(c=>c.vinculos.map((v,i)=>({c,v,i}))).filter(x=>`${x.c.nome} ${x.c.email} ${x.c.cpf} ${condo(x.v.condoId)?.nome}`.toLowerCase().includes((state.portalSearch||'').toLowerCase())).map(({c,v,i})=>`<tr><td><b>${esc(c.nome)}</b><div class="sub">${esc(c.email)} · ${portalEscCpf(c.cpf)}</div></td><td>${esc(condo(v.condoId)?.nome||'—')}</td><td>${esc(v.tipo)} ${v.unidade?`· ${esc(v.unidade)}`:''}</td><td>${portalBadge(v.status)}</td><td>${v.status==='Em análise'?`<button class="btn small" onclick="UI.portalApprove(${c.id},${i},true)">Aprovar</button> <button class="btn secondary small" onclick="UI.portalApprove(${c.id},${i},false)">Rejeitar</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`},
 inbox(){return `<div class="metrics">${metric('Recebidos',portalDB.tickets.length,'Solicitações registradas','◉')}${metric('Em triagem',portalDB.tickets.filter(t=>t.status==='Recebido').length,'Inclui cadastro pendente','!')}${metric('Aguardando cliente',portalDB.tickets.filter(t=>t.status==='Aguardando cliente').length,'Contagem de 72h','◷')}${metric('Encerrados',portalDB.tickets.filter(t=>t.status==='Encerrado').length,'Finalizados','✓')}</div><div class="panel">${titlePanel('Fila de atendimento do administrativo')}<p class="sub">O administrativo recebe chamados de cadastros ainda não aprovados. As mensagens do cliente cancelam a contagem de 72 horas.</p><div style="overflow:auto"><table><thead><tr><th>Protocolo</th><th>Solicitante</th><th>Condomínio</th><th>Status</th><th>Prazo</th></tr></thead><tbody>${[...portalDB.tickets].reverse().map(t=>`<tr><td><a class="click" onclick="UI.portalAdminTicket(${t.id})">${esc(t.protocol)}<div class="sub">${esc(t.titulo)}</div></a></td><td>${esc(portalClient(t.clientId)?.nome||'—')}<div class="sub">${esc(portalClient(t.clientId)?.vinculos.find(v=>v.condoId===t.condoId)?.status||'—')}</div></td><td>${esc(condo(t.condoId)?.nome||'—')}</td><td>${portalBadge(t.status)}</td><td>${t.closeAt?portalDate(t.closeAt):'—'}</td></tr>`).join('')}</tbody></table></div></div>`},
 ratings(){let rated=portalDB.tickets.filter(t=>t.rating);let avg=rated.length?(rated.reduce((s,t)=>s+t.rating.stars,0)/rated.length).toFixed(2):'—';return `<div class="metrics">${metric('Avaliações',rated.length,'Respostas recebidas','★')}${metric('Média geral',avg,'Escala de 1 a 5 estrelas','★')}${metric('Atendimentos encerrados',portalDB.tickets.filter(t=>t.status==='Encerrado').length,'Elegíveis à avaliação','✓')}${metric('Taxa de resposta',portalDB.tickets.filter(t=>t.status==='Encerrado').length?Math.round(rated.length/portalDB.tickets.filter(t=>t.status==='Encerrado').length*100)+'%':'—','Dos encerrados','▥')}</div><div class="panel">${titlePanel('Avaliações por profissional')}<table><thead><tr><th>Profissional</th><th>Avaliações</th><th>Média</th></tr></thead><tbody>${[...NAMES,'Administrativo'].map(n=>{let a=rated.filter(t=>t.owner===n);return `<tr><td>${esc(n)}</td><td>${a.length}</td><td>${a.length?(a.reduce((s,t)=>s+t.rating.stars,0)/a.length).toFixed(2)+' / 5':'Sem avaliações'}</td></tr>`}).join('')}</tbody></table><p class="sub" style="margin-top:15px">Métricas demonstrativas. Para produção, a atribuição da avaliação ao profissional dependerá da responsabilidade efetiva pelo atendimento e pela resolução, com auditoria.</p></div>`}
};

Object.assign(headings,{portal:['Portal do cliente','Cadastro, abertura de chamados e acompanhamento pelo solicitante.'],approvals:['Validação de cadastros','Clientes podem abrir chamados antes da aprovação.'],inbox:['Triagem administrativa','Protocolos, mensagens, respostas conclusivas e 72 horas.'],ratings:['Avaliações de atendimento','Notas de 1 a 5 estrelas e indicadores por responsável.']});
UI.portalSwitchClient=function(id){state.portalClientId=Number(id);render()};
UI.portalSearch=function(v){state.portalSearch=v;render();let el=$('.search');if(el){el.focus();el.setSelectionRange(v.length,v.length)}};
UI.portalRegister=function(){state.modal='portalRegister';render()};
UI.portalNewTicket=function(){state.modal='portalNewTicket';render()};
UI.portalOpenTicket=function(id){state.detail=id;state.modal='portalClientTicket';render()};
UI.portalAdminTicket=function(id){state.detail=id;state.modal='portalAdminTicket';render()};
UI.portalApprove=function(id,i,approved){let c=portalClient(id);if(!c||!c.vinculos[i])return;c.vinculos[i].status=approved?'Aprovado':'Rejeitado';portalSave();render()};
UI.portalSubmitRegister=function(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let cpf=String(f.cpf).replace(/\D/g,'');if(!/^\d{11}$/.test(cpf)){alert('Informe um CPF de 11 dígitos.');return}if(portalDB.clients.some(c=>c.cpf===cpf)){alert('CPF já cadastrado nesta demonstração. Selecione o cliente existente.');return}let c={id:portalDB.nextClient++,nome:f.nome.trim(),cpf,email:f.email.trim(),telefone:f.telefone.trim(),vinculos:[{condoId:Number(f.condoId),tipo:f.tipo,unidade:f.unidade||'',outro:f.outro||'',status:'Em análise'}],created:new Date().toISOString()};portalDB.clients.push(c);state.portalClientId=c.id;portalSave();state.modal='portalNewTicket';render()};
UI.portalSubmitTicket=function(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let c=portalClient(state.portalClientId||1);let condoId=Number(f.condoId);if(!c?.vinculos.some(v=>v.condoId===condoId)){alert('Selecione um condomínio vinculado ao cadastro.');return}let n=portalDB.nextTicket++;let t={id:n,protocol:`EX-${new Date().getFullYear()}-${String(n).padStart(5,'0')}`,clientId:c.id,condoId,titulo:f.titulo.trim(),descricao:f.descricao.trim(),categoria:f.categoria,status:'Recebido',owner:assignedSyndic(condoId),created:new Date().toISOString(),messages:[{at:new Date().toISOString(),by:'Cliente',text:f.descricao.trim(),visibility:'public'}],resolvedAt:null,closeAt:null,closedBy:null,rating:null};portalDB.tickets.push(t);portalSave();state.detail=n;state.modal='portalClientTicket';render()};
UI.portalAdminReply=function(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let t=portalTicket(id);if(!t)return;t.owner=f.owner;t.messages.push({at:new Date().toISOString(),by:'Operador',text:f.text.trim(),visibility:f.action==='internal'?'internal':'public'});if(f.action==='resolve'){t.status='Aguardando cliente';t.resolvedAt=new Date().toISOString();t.closeAt=new Date(Date.now()+72*3600000).toISOString()}else if(f.action==='reply'&&t.status==='Aguardando cliente'){t.status='Em atendimento';t.closeAt=null}else if(t.status==='Recebido')t.status='Em atendimento';portalSave();render()};
UI.portalClientReply=function(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let t=portalTicket(id);if(!t||t.status==='Encerrado')return;t.messages.push({at:new Date().toISOString(),by:'Cliente',text:f.text.trim(),visibility:'public'});t.status='Em atendimento';t.closeAt=null;portalSave();render()};
UI.portalClientClose=function(id){let t=portalTicket(id);if(!t||t.status==='Encerrado')return;if(!confirm('Deseja realmente encerrar este chamado?'))return;t.status='Encerrado';t.closedBy='Cliente';t.closedAt=new Date().toISOString();t.closeAt=null;t.messages.push({at:new Date().toISOString(),by:'Sistema',text:'Encerrado por solicitação do cliente.',visibility:'public'});portalSave();render()};
UI.portalRate=function(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let t=portalTicket(id);if(!t||t.status!=='Encerrado'||t.rating)return;t.rating={stars:Number(f.stars),comment:f.comment.trim(),at:new Date().toISOString(),professional:t.owner};portalSave();render()};
const oldRenderModal=renderModal;
renderModal=function(){let m=state.modal;if(m==='portalRegister')return modal('Novo cadastro · Portal Exclusive',`<form onsubmit="UI.portalSubmitRegister(event)"><p class="sub">Use apenas informações fictícias para testar. O cadastro ficará em análise, mas você já poderá abrir um chamado.</p><div class="formgrid"><label class="field full">Nome completo<input class="input" name="nome" required maxlength="120"></label><label class="field">CPF (11 dígitos)<input class="input" name="cpf" inputmode="numeric" pattern="[0-9.\\-]{11,14}" required placeholder="000.000.000-00"></label><label class="field">E-mail<input class="input" type="email" name="email" required></label><label class="field">Telefone / WhatsApp<input class="input" name="telefone" required></label><label class="field">Condomínio<select name="condoId" required>${portalCondoOptions()}</select></label><label class="field">Vínculo<select name="tipo"><option>Proprietário</option><option>Inquilino</option><option>Outro interessado</option></select></label><label class="field">Unidade / bloco (se houver)<input class="input" name="unidade"></label><label class="field full">Se outro interessado, explique o vínculo<input class="input" name="outro" placeholder="Ex.: familiar, representante ou prestador"></label></div><div class="modalactions"><button type="button" class="btn secondary" onclick="UI.close()">Cancelar</button><button class="btn">Cadastrar e abrir chamado</button></div></form>`);if(m==='portalNewTicket'){let c=portalClient(state.portalClientId||1);return modal('Abrir solicitação · '+esc(c?.nome||''),`<form onsubmit="UI.portalSubmitTicket(event)"><p class="sub">O protocolo será gerado imediatamente, mesmo com o cadastro em análise. A equipe administrativa receberá a solicitação para triagem e validação.</p><div class="formgrid"><label class="field full">Condomínio<select name="condoId" required>${(c?.vinculos||[]).map(v=>`<option value="${v.condoId}">${esc(condo(v.condoId)?.nome||'—')} · ${esc(v.status)}</option>`).join('')}</select></label><label class="field full">Assunto<input class="input" name="titulo" required maxlength="140" placeholder="Ex.: Vazamento na garagem"></label><label class="field">Categoria<select name="categoria">${['Manutenção','Segurança','Limpeza','Convivência','Administrativo','Outros'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field full">Descreva a solicitação<textarea name="descricao" rows="5" required placeholder="Informe o problema e onde está ocorrendo"></textarea></label></div><p class="sub">Anexos ainda não estão disponíveis nesta versão local. Na versão online, serão enviados para armazenamento privado com controle de acesso.</p><div class="modalactions"><button type="button" class="btn secondary" onclick="UI.close()">Cancelar</button><button class="btn">Registrar e gerar protocolo</button></div></form>`)}if(m==='portalClientTicket'){let t=portalTicket(state.detail);return modal('Acompanhar solicitação',portalDetail(t,'client'))}if(m==='portalAdminTicket'){let t=portalTicket(state.detail);return modal('Triagem e atendimento',portalDetail(t,'admin'))}return oldRenderModal()};
portalCheckAuto();
// Verificação periódica enquanto a aba está aberta; em produção deve ocorrer no servidor.
setInterval(()=>{let old=portalDB.tickets.filter(t=>t.status==='Encerrado').length;portalCheckAuto();if(portalDB.tickets.filter(t=>t.status==='Encerrado').length!==old)render()},60000);

function canEditCondo(){return ['Master','Gerente','Síndico','Administrativo'].includes(activeRole)}

function syndicNames(){return [...new Set([...NAMES,...authUsers.filter(u=>u.ativo&&u.perfil==='Síndico').map(u=>u.nome)])]}
function assignmentOptions(value){return ['Não atribuído',...syndicNames()].map(n=>`<option value="${esc(n)}" ${value===n?'selected':''}>${esc(n)}</option>`).join('')}
function assignedSyndic(id){const n=condo(id)?.sindico;return n&&n!=='Não atribuído'?n:'Não atribuído'}
function syncImportedCondos(){
 const versionKey='exclusive_condos_import_version';let prior='';try{prior=localStorage.getItem(versionKey)||''}catch(e){}
 if(prior===IMPORT_VERSION)return;
 const original=db.condos||[];
 // Only replace known demo seed. Preserve manually created records where possible.
 const isDemo=original.length===108&&original.some(c=>c.nome==='Jardim das Palmeiras');
 if(isDemo){db.condos=IMPORTED_CONDOS.map(c=>({...c}));db.tasks=[];db.inspections=[];if(typeof portalDB!=='undefined'){portalDB.tickets=[];portalDB.clients=[];portalDB.nextClient=1;portalDB.nextTicket=1;portalSave()}}
 else {
  const byName=new Map(original.map(c=>[String(c.nome||'').trim().toUpperCase(),c]));
  const occupied=new Set();
  db.condos=IMPORTED_CONDOS.map(c=>{const old=byName.get(c.nome.toUpperCase());if(old){occupied.add(old.id);return {...c,...old,sindico:old.sindico&&old.sindico!=='Não atribuído'?old.sindico:c.sindico,id:old.id,codigoOrigem:c.codigoOrigem,fonte:c.fonte}}return {...c,id:0}});
  let next=Math.max(0,...original.map(c=>Number(c.id)||0),...IMPORTED_CONDOS.map(c=>c.id))+1;
  for(const c of db.condos)if(!c.id)c.id=next++;
  for(const old of original)if(!occupied.has(old.id)&&old.fonte!=='Planilha importada')db.condos.push(old);
 }
 db.importVersion=IMPORT_VERSION;save();try{localStorage.setItem(versionKey,IMPORT_VERSION)}catch(e){}
}
syncImportedCondos();

 }return priorModal()};
UI.saveImportedCondo=function(e,id){e.preventDefault();if(!canEditCondo()){alert('Perfil sem permissão.');return}let c=condo(id);if(!c)return;let form=Object.fromEntries(new FormData(e.target));let changes=[];for(let [k,v] of Object.entries(form)){if(k==='sindico'&&!canAssignPortfolio())continue;if(k==='sindico'&&!['Não atribuído',...syndicNames()].includes(v))return alert('Síndico não cadastrado.');if(k==='unidades')v=Number(v)||0;if(String(c[k]??'')!==String(v)){changes.push(k+': '+String(c[k]??'')+' → '+String(v));c[k]=v}}if(changes.length)recordAudit(c,changes);save();UI.close()};

function saveUsers(){localStorage.setItem(AUTH_USERS_KEY,JSON.stringify(authUsers))}
function loginScreen(){return `<div style="min-height:100vh;background:linear-gradient(145deg,#252449,#3c3a73);display:grid;place-items:center;padding:20px"><div style="background:#fff;border-radius:20px;padding:32px;width:min(100%,430px);box-shadow:0 20px 70px #1115"><div style="color:#302f61;font-weight:900;letter-spacing:.07em;font-size:20px">▥ EXCLUSIVE SÍNDICOS</div><p style="color:#98783f;font-weight:700;margin:8px 0 24px">SISTEMA OPERACIONAL</p><h1 style="font-size:27px;margin-bottom:8px">Acessar o sistema</h1><p style="color:#666;margin-bottom:22px">Entre com suas credenciais de acesso.</p><form onsubmit="UI.login(event)"><label class="field">CPF<input class="input" name="cpf" inputmode="numeric" autocomplete="username" required placeholder="000.000.000-00"></label><label class="field" style="margin-top:14px">Senha<input class="input" type="password" name="senha" autocomplete="current-password" required placeholder="Sua senha"></label><button class="btn" style="width:100%;margin-top:22px;justify-content:center">Entrar</button></form><p style="font-size:12px;color:#777;margin-top:16px">AMBIENTE PÚBLICO DE DEMONSTRAÇÃO: sem dados cadastrais reais. Não digite CPF, senha ou informações pessoais verdadeiras.</p></div></div>`}
UI.login=function(e){e.preventDefault();const f=new FormData(e.target),cpf=cpfDigits(f.get('cpf')),pass=String(f.get('senha'));const u=authUsers.find(u=>u.ativo&&cpfDigits(u.cpf)===cpf&&u.senha===pass);if(!u){alert('Usuário ou senha inválidos.');return}authId=u.id;sessionStorage.setItem(AUTH_SESSION_KEY,String(authId));activeRole=u.perfil;state.page='dashboard';render()};
UI.logout=function(){authId=null;sessionStorage.removeItem(AUTH_SESSION_KEY);state.modal=null;render()};
const beforeAuthRender=render;
render=function(){const u=currentUser();if(!u){document.querySelector('#root').innerHTML=loginScreen();return}activeRole=u.perfil;if(!canManageUsers()&&state.page==='users')state.page='dashboard';beforeAuthRender();document.querySelectorAll('.topright label').forEach(el=>{if(el.textContent.includes('Perfil demonstrativo'))el.remove()});const header=document.querySelector('.topright');if(header){const x=document.createElement('span');x.className='sub';x.textContent=u.nome+' · '+u.perfil;header.prepend(x);const b=document.createElement('button');b.className='btn secondary small';b.textContent='Sair';b.onclick=UI.logout;header.append(b)}if(canManageUsers()){const n=document.querySelector('.sidebar nav');if(n){const b=document.createElement('button');b.className='navbtn '+(state.page==='users'?'active':'');b.innerHTML='<span class="sym">♙</span> Usuários e acessos';b.onclick=()=>UI.page('users');n.append(b)}}if(state.page==='users'){const content=document.querySelector('.content');if(content){const heading=content.querySelector('.heading');if(heading){heading.innerHTML='<div><h1>Usuários e acessos</h1><p class="sub">Equipe pré-cadastrada, perfis e acessos demonstrativos</p></div><button class="btn" onclick="UI.userForm()">＋ Novo usuário</button>'}const notice=content.querySelector('.notice');if(notice)notice.textContent='Demonstração pública: não cadastre CPF, e-mail, senha ou dados reais. A ativação segura será feita no backend.';const footer=content.querySelector('footer');const div=document.createElement('div');div.innerHTML=usersTable();content.insertBefore(div,footer);const roster=document.createElement('div');roster.innerHTML=teamRoster();content.insertBefore(roster,div)}}};
function usersTable(){return `<div class="panel"><div class="tablewrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody>${authUsers.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.cpf?u.cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,"$1.$2.$3-$4"):"Pendente")}</td><td>${esc(u.email)}</td><td>${esc(u.perfil)}</td><td>${u.ativo?'Ativo':'Bloqueado'}</td><td><button class="btn secondary small" onclick="UI.userForm(${u.id})">Editar / senha</button></td></tr>`).join('')}</tbody></table></div></div>`}
UI.userForm=function(id){if(!canManageUsers())return alert('Acesso negado');state.modal='userForm';state.detail=id||null;render()};
const beforeUserModal=renderModal;
renderModal=function(){if(state.modal!=='userForm')return beforeUserModal();if(!canManageUsers())return '';const u=authUsers.find(x=>x.id===state.detail);return modal(u?'Editar usuário':'Novo usuário',`<form onsubmit="UI.saveUser(event)"><div class="formgrid"><label class="field full">Nome completo<input class="input" name="nome" required value="${esc(u?.nome||'')}"></label><label class="field full">E-mail obrigatório<input class="input" type="email" name="email" required value="${esc(u?.email||'')}"></label><label class="field full">CPF obrigatório<input class="input" name="cpf" inputmode="numeric" required placeholder="000.000.000-00" value="${esc(u?.cpf||'')}"></label><label class="field">Perfil<select name="perfil">${ROLE_LIST.map(r=>`<option ${u?.perfil===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="field">Situação<select name="ativo"><option value="true" ${u?.ativo!==false?'selected':''}>Ativo</option><option value="false" ${u?.ativo===false?'selected':''}>Bloqueado</option></select></label><label class="field full">${u?'Nova senha (deixe em branco para manter)':'Senha inicial'}<input class="input" type="password" name="senha" ${u?'':'required'} minlength="6" autocomplete="new-password"></label></div><div class="modalactions"><button type="button" class="btn secondary" onclick="UI.close()">Cancelar</button><button class="btn">Salvar usuário</button></div></form>`)};
UI.saveUser=function(e){e.preventDefault();if(!canManageUsers())return alert('Acesso negado');const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),cpf=cpfDigits(f.get('cpf')),nome=String(f.get('nome')).trim(),perfil=String(f.get('perfil')),senha=String(f.get('senha')),ativo=f.get('ativo')==='true';if(!validCPF(cpf))return alert('CPF inválido. Confira os 11 dígitos e os verificadores.');if(authUsers.some(x=>cpfDigits(x.cpf)===cpf&&x.id!==state.detail))return alert('CPF já cadastrado');if(authUsers.some(x=>x.email.toLowerCase()===email&&x.id!==state.detail))return alert('Este usuário já existe');if(!ROLE_LIST.includes(perfil))return alert('Perfil inválido');let u=authUsers.find(x=>x.id===state.detail);if(u){if(u.id===authId&&(!ativo||!['Master','Gerente'].includes(perfil)))return alert('Não é permitido remover o próprio acesso de gestão nesta sessão.');Object.assign(u,{nome,email,cpf,perfil,ativo});if(senha)u.senha=senha}else authUsers.push({id:Math.max(0,...authUsers.map(x=>x.id))+1,nome,email,cpf,perfil,senha,ativo});saveUsers();state.modal=null;render()};
// A tela de usuários não existe no mapa de views original; fornecemos um placeholder.
headings.users=['Usuários e acessos','Gestão de contas e permissões'];views.users=()=>'';
const oldPage=UI.page;UI.page=function(page){if(!currentUser())return;if(page==='users'&&!canManageUsers())return alert('Acesso negado');return oldPage(page)};

UI.syncTaskOwner=function(select){const input=select.closest('form')?.querySelector('[name="responsavel"]');if(input)input.value=assignedSyndic(Number(select.value))};
const baseSubmitCondo=UI.submitCondo;
UI.submitCondo=function(e){if(!canAssignPortfolio()){e.preventDefault();return alert('Somente Master e Gerente podem atribuir síndicos.')}return baseSubmitCondo(e)};
const baseEditCondo=UI.submitEditCondo;
UI.submitEditCondo=function(e,id){if(!canAssignPortfolio()){const field=e.target.querySelector('[name="sindico"]');if(field)field.value=condo(id)?.sindico||'Não atribuído'}return baseEditCondo(e,id)};
const baseNewTaskModal=renderModal;
// A ficha do condomínio mostra o síndico atribuído; alterações futuras não reescrevem o histórico de chamados.
const basePortalSubmitTicket=UI.portalSubmitTicket;
UI.portalSubmitTicket=function(e){return basePortalSubmitTicket(e)};
// Carteiras da equipe e chamados sempre consultam o vínculo atual, sem inventar responsáveis.
const baseStaff=UI.staff;
UI.staff=function(name){return baseStaff(name)};
