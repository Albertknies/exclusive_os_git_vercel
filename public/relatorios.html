<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios · Exclusive OS</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f3;color:#232344;font:15px system-ui,Arial}header{background:#242443;color:#fff;padding:22px max(22px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:20px}a{color:inherit}main{max-width:1120px;margin:32px auto;padding:0 22px}h1{margin:0 0 6px}p{color:#656579;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px;margin-top:24px}.card{border:1px solid #e3ded4;background:#fff;border-radius:13px;padding:22px;box-shadow:0 7px 25px #2221}.card h2{font-size:17px;margin:0 0 9px}.card p{font-size:13px;min-height:36px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:0;background:#29294e;color:white;border-radius:8px;padding:10px 13px;font-weight:650}button.alt{background:#eadcbf;color:#4c3a20}button:disabled{opacity:.6}.toolbar{background:white;padding:18px;border-radius:12px;border:1px solid #e5dfd4;margin-top:22px}select{font:inherit;padding:10px;border:1px solid #c9c7d0;border-radius:8px;max-width:100%}#status{font-weight:600}#printArea{display:none}@media print{header,main{display:none!important}#printArea{display:block!important;padding:10mm}#printArea table{border-collapse:collapse;width:100%;font-size:10px}#printArea td,#printArea th{border:1px solid #aaa;padding:6px;text-align:left;overflow-wrap:anywhere}#printArea h1{font-size:20px}body{background:#fff}}</style></head><body><header><b>◆ EXCLUSIVE OS <span style="color:#e5c477">| Relatórios</span></b><a href="/operacional.html">← Voltar ao painel</a></header><main><h1>Central de relatórios</h1><p>Escolha um relatório e exporte em CSV ou PDF. Os dados disponíveis respeitam seu perfil e a carteira de condomínios vinculada ao seu usuário.</p><div class="toolbar"><label for="condo">Filtrar condomínio: </label><select id="condo"><option value="">Todos os condomínios autorizados</option></select><p id="status">Carregando permissões...</p></div><div id="grid" class="grid"></div></main><div id="printArea"></div><script>const $=id=>document.getElementById(id);let tipos=[];const descriptions={condominios:'Cadastro e responsáveis',manutencoes:'Serviços e acompanhamento',chamados:'Atendimentos, protocolos e avaliações',vistorias:'Inspeções e situações',tarefas:'Registros históricos de tarefas',processos:'Registros históricos de processos',financeiro:'Receitas, despesas e vencimentos'};async function get(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro ao consultar dados');return d}function escapeCsv(v){let x=String(v??'');if(/^[=+@\-\t\r]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}async function exportReport(id,format,btn){btn.disabled=true;$('status').textContent='Preparando relatório...';try{const params=new URLSearchParams({tipo:id});if($('condo').value)params.set('condominio_id',$('condo').value);const data=await get('/api/relatorios?'+params);if(format==='csv'){const csv='\uFEFF'+[data.columns,...data.rows].map(row=>row.map(escapeCsv).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='exclusive-os-'+id+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}else{const area=$('printArea');area.replaceChildren();const h=document.createElement('h1');h.textContent='Exclusive OS · '+data.title;const p=document.createElement('p');p.textContent='Emitido em '+new Date().toLocaleString('pt-BR')+' · '+data.total+' registros';const table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');for(const col of data.columns){const th=document.createElement('th');th.textContent=col;tr.append(th)}thead.append(tr);table.append(thead);const tbody=document.createElement('tbody');for(const row of data.rows){const line=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=String(value??'');line.append(td)}tbody.append(line)}table.append(tbody);area.append(h,p,table);window.print()}$('status').textContent='Relatório '+data.title+': '+data.total+' registros.'+(data.total>=2000?' Limite de 2000 registros por exportação.':'')}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}}async function init(){try{const info=await get('/api/relatorios');tipos=info.tipos;$('status').textContent='Perfil: '+info.perfil+'. Relatórios disponíveis: '+tipos.length;const c=await get('/api/operacoes?entity=condominios');for(const item of c.items||[]){const o=new Option(item.nome,item.id);$('condo').add(o)}for(const t of tipos){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=t.title;const p=document.createElement('p');p.textContent=descriptions[t.id]||'Relatório operacional';const buttons=document.createElement('div');buttons.className='actions';for(const [format,label] of [['csv','↓ CSV'],['pdf','⎙ PDF']]){const btn=document.createElement('button');btn.className=format==='pdf'?'alt':'';btn.textContent=label;btn.onclick=()=>exportReport(t.id,format,btn);buttons.append(btn)}card.append(title,p,buttons);$('grid').append(card)}}catch(e){$('status').textContent=e.message+' · Volte ao painel e entre no sistema.'}}init();</script></body></html>
