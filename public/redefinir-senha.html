<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar senha | Exclusive OS</title><style>body{font:16px system-ui;background:#f6f5f2;color:#232345;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}main{max-width:440px;width:100%;background:white;border-radius:16px;padding:28px;box-shadow:0 8px 30px #0001}label{display:block;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b7b7c8;border-radius:8px;font:inherit}button{margin-top:20px;background:#302f61;color:white;border:0;border-radius:8px;padding:13px;width:100%;font:inherit;cursor:pointer}a{color:#302f61}#msg{margin-top:18px;white-space:pre-wrap}</style></head><body><main><h1 id="heading">Esqueceu a senha?</h1><p id="hint">Informe o e-mail cadastrado. Se a recuperação estiver habilitada, enviaremos um link válido por 15 minutos.</p><form id="form"><label id="label">E-mail cadastrado</label><input id="email" type="email" autocomplete="email" required><button id="btn">Enviar link de recuperação</button></form><p id="msg" role="status" aria-live="polite"></p><p><a href="/admin.html">Voltar ao login</a></p></main><script>
const token=new URLSearchParams(location.search).get('token'),form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#btn');
if(token){document.querySelector('#heading').textContent='Criar nova senha';document.querySelector('#hint').textContent='Digite uma nova senha de pelo menos 12 caracteres.';document.querySelector('#label').textContent='Nova senha';document.querySelector('#email').outerHTML='<input id="senha" type="password" autocomplete="new-password" minlength="12" required><label>Confirme a nova senha</label><input id="confirmar" type="password" autocomplete="new-password" minlength="12" required>';btn.textContent='Redefinir senha'}
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;try{let action,body;if(token){const senha=document.querySelector('#senha').value;if(senha!==document.querySelector('#confirmar').value)throw Error('As senhas não coincidem');action='confirm';body={token,senha}}else{action='request';body={email:document.querySelector('#email').value.trim()}}const r=await fetch('/api/password-reset?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Não foi possível continuar');msg.textContent=data.message||'Solicitação recebida';if(token){form.reset();form.hidden=true;history.replaceState(null,'','/redefinir-senha.html')}}catch(err){msg.textContent=err.message}finally{btn.disabled=false}});
</script></body></html>
